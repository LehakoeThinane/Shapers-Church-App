project_id = "shapers-church-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "exp://localhost:19000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Must stay true: onboard_match_person() (see
# supabase/migrations/20260818090000_onboard_match_person_verified_identity.sql)
# only trusts an email for identity matching once Supabase has actually
# confirmed the caller owns it. With confirmations off, email_confirmed_at
# gets set for everyone at signup regardless of real ownership, silently
# defeating that check.
enable_confirmations = true

[storage]
enabled = true

[edge_runtime]
enabled = true

# pc-checkin-sync, pc-milestone-sync, and qr-token-generate are invoked by
# Database Webhooks / Scheduled Functions, not signed-in users — verify_jwt
# would otherwise only require *a* valid Supabase JWT, and the public anon
# key shipped in every client bundle satisfies that trivially. Each checks
# its own shared secret instead (supabase/functions/_shared/webhookAuth.ts).
[functions.pc-checkin-sync]
verify_jwt = false

[functions.pc-milestone-sync]
verify_jwt = false

[functions.qr-token-generate]
verify_jwt = false

[functions.pc-oauth-connect]
verify_jwt = true
