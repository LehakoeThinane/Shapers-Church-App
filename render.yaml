services:
  - type: web
    name: shapers-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter api build
    startCommand: pnpm --filter api start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BOOTSTRAP_TOKEN
        sync: false
      - key: CORS_ORIGIN
        value: "*"
